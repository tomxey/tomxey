[package]
name = "password_wallet_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
password_auth_core = { path = "../password_auth_core" }
anyhow = "1"
bcs = "0.1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
hex = "0.4"
rpassword = "7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

iota-sdk = { git = "https://github.com/iotaledger/iota.git", branch = "develop" }
iota-types = { git = "https://github.com/iotaledger/iota.git", branch = "develop" }
iota-keys = { git = "https://github.com/iotaledger/iota.git", branch = "develop" }
# Same rev as pinned by the iota monorepo (develop) so types are shared.
iota-sdk-types = { git = "https://github.com/iotaledger/iota-rust-sdk.git", rev = "2f021d0556e47564e9b04bcd0b3e8347c41a0a26", features = ["hash", "serde"] }

# fastcrypto-tbls (pulled transitively via iota-types) fetches fastcrypto
# through an in-repo path dep. Redirect it to the crates.io release so the
# build shares a single fastcrypto instead of two conflicting copies.
[patch."https://github.com/MystenLabs/fastcrypto"]
fastcrypto = "=0.1.11"
