<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>On-chain Todo (testnet)</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- No start_url in the manifest: it defaults to the installing page's
         URL, which keeps the ?account=…&username=… params in the installed app. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#db4c3f" />
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/todo/todo.css" />
  </head>
  <body>
    <main>
      <h1>On-chain Todo <span class="badge">testnet</span></h1>
      <details class="about">
        <summary>how it works</summary>
        <p class="intro">
          A todo list stored on IOTA — every top-level item is its own on-chain
          object owned by your password wallet, and the chain only ever sees
          ciphertext. The key is derived from your password in WASM, in this tab.
        </p>
      </details>

      <section id="unlock-section">
        <h2>Unlock</h2>
        <p class="hint" id="unlock-info"></p>
        <form id="unlock-form">
          <label>Username
            <input id="unlock-username" name="username" autocomplete="username" readonly />
          </label>
          <label>Password
            <input id="unlock-password" name="password" type="password" autocomplete="current-password" />
          </label>
          <button type="submit" id="unlock-btn">Unlock</button>
        </form>
      </section>

      <section id="todo-section" hidden>
        <h2>Todo items</h2>
        <div id="status-bar">
          <span id="gas-status" title="wallet gas balance">⛽ …</span>
          <span id="updated-status"></span>
          <span id="refreshed-status"></span>
          <button id="refresh-btn" class="icon-btn" title="refresh from chain">⟳ refresh</button>
        </div>
        <form id="add-form">
          <input id="add-text" placeholder="new item…" autocomplete="off" />
          <button type="submit">Add</button>
        </form>
        <ul id="todo-list"></ul>
      </section>

      <div id="sync-spinner" title="syncing with chain…" hidden>⟳</div>

      <section>
        <h2>Log</h2>
        <pre id="log"></pre>
      </section>
    </main>
    <script type="module" src="./src/todo/main.js"></script>
  </body>
</html>
